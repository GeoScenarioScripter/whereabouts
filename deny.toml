# cargo-deny configuration. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with distributing Whereabouts under MIT OR Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # D-07: no GDAL in the core. GDAL is only ever invoked as a CLI to regenerate oracle golden
  # files (tests/corpus/scripts) or inside the optional out-of-process Extended Format Pack.
  { crate = "gdal", reason = "D-07: no GDAL linked into Whereabouts" },
  { crate = "gdal-sys", reason = "D-07: no GDAL linked into Whereabouts" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
