[package]
name = "whereabouts-nameindex"
description = "Compact in-memory filename index: string pool, path reconstruction, substring/wildcard scan, snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes `synth` (deterministic synthetic volumes) for tests and benchmarks, here and in other
# crates (e.g. stage01/4.3). Enable only from `[dev-dependencies]`; not part of the production API.
synth = []

[dependencies]
whereabouts-core.workspace = true
whereabouts-source.workspace = true
crc32fast.workspace = true
memchr.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Self dev-dependency: turns on `synth` for this crate's tests, benches and examples only.
whereabouts-nameindex = { path = ".", features = ["synth"] }
# `test-fixtures` exposes `record::build` (synthetic USN enumeration buffers) for the #26
# ingestion benchmark. Pure code: builds and runs on Linux.
whereabouts-ntfs = { workspace = true, features = ["test-fixtures"] }
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "search"
harness = false

[[bench]]
name = "ingest"
harness = false
