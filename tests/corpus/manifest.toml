# Whereabouts test corpus manifest. Format documented in tests/corpus/README.md.
#
# One [[case]] per dataset. Data lives in tests/corpus/data/<format>/<id>/ (committed) or
# tests/corpus/external/<format>/<id>/ (fetched by scripts/fetch-external.*, gitignored); the
# GDAL oracle record is tests/corpus/expected/<id>.json.
#
# origin = "synthetic"   → rebuilt by scripts/generate.py (builder named after the id)
# origin = "real-world"  → committed or fetched as-is; never regenerated
# The tag vocabulary is listed in tests/corpus/README.md; tests/oracle checks every required edge
# case tag is covered by at least one case.

schema = 1

