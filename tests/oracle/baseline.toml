# Oracle agreement baseline — enforced by `cargo test -p whereabouts-oracle` (tests/agreement.rs).
#
# The agreement test fails if any per-format, per-check agreement rate drops below `min_rate`
# (per-format overrides in [format.<name>.min_rate]). Checks an adapter does not declare, and
# checks with nothing compared, are not rate-tested; agreement.rs separately requires coverage.
# Raise these as readers land; never lower one without a recorded reason (PR + session note).
#
# Values proposed by stage01 session 1.2 (not yet decisions — see the session note).

[tolerance]
# Native extents: pass if |a - b| <= native_abs OR <= native_rel * max(|a|, |b|).
# Header bboxes are stored as doubles, so agreement should be essentially exact.
native_abs = 1e-6
native_rel = 1e-9
# WGS84 extents in degrees (~1.1 km at the equator). Covers proj4rs-vs-PROJ differences such as
# ignored datum grid shifts (D-09: metres of error are fine for a search index). Q-14 may tighten.
wgs84_deg = 0.01
# Raster pixel size, relative.
resolution_rel = 1e-9

[min_rate]
# Stage01 exit criterion 4: native bbox, geometry type and counts agree on >= 98% of cases.
status = 1.0
layers = 1.0
geometry_type = 0.98
feature_count = 0.98
native_extent = 0.98
raster = 0.98
# D-34: Q-14 resolved at G2; enforced through shared indexer::extract in 4.3.
epsg = 0.98
wgs84_extent = 0.98

[format.shapefile.min_rate]
# stage01/2.6: the native shapefile reader agrees on every non-corrupt case (18/18 committed,
# 19/19 with the external sample), so any regression fails CI.
geometry_type = 1.0
feature_count = 1.0
native_extent = 1.0
epsg = 1.0
wgs84_extent = 1.0

[format.geopackage.min_rate]
# stage01/3.1: every committed non-corrupt layer agrees, including missing/stale bounds.
geometry_type = 1.0
feature_count = 1.0
native_extent = 1.0
epsg = 1.0
wgs84_extent = 1.0

[format.geotiff.min_rate]
# stage01/3.2: every non-corrupt committed case agrees, including PAM/worldfile georeferencing.
native_extent = 1.0
epsg = 1.0
wgs84_extent = 1.0
raster = 1.0
