name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the v1 target (D-19). Linux keeps every non-NTFS crate portable (D-18).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # GitHub-hosted Windows runners are elevated, so raw-volume NTFS tests (marked #[ignore]
      # because they need admin) can run here. See AGENTS.md "Testing".
      - name: NTFS volume tests (elevated)
        if: runner.os == 'Windows'
        run: cargo test -p whereabouts-ntfs --no-fail-fast -- --ignored
      # Release-build timings of both enumeration methods on C: (read-only), for Q-16 / #29.
      - name: enum_volume, USN API vs raw $MFT (release, elevated)
        if: runner.os == 'Windows'
        # bash with -e so a failing command (including a raw scan that lost records) fails the job.
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -p whereabouts-ntfs --example enum_volume -- C: --count-only
          cargo run --release -p whereabouts-ntfs --example enum_volume -- C: --mft --count-only

  deny:
    name: cargo-deny (licenses, advisories, bans incl. no-GDAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
