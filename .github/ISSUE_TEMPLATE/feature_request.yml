name: Feature request
description: Suggest a feature or a format to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to find or do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Indexing / file system, Formats & CRS, Search & filters, Map & previews, Hand-off to QGIS/ArcGIS, Other]
